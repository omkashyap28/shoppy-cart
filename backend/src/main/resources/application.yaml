spring:
  security.oauth2.client:
    registration:
      google:
        client-id: ${GOOGLE_OAUTH_CLIENT_ID}
        client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_APP_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true