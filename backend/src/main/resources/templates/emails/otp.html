<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>OTP Verification - Shopyhub</title>
    <style>
        /* Base Reset */
        body, p, h2, h1, h4 {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding: 40px 20px;
        }

        .wrapper {
            max-width: 500px; /* Slightly narrower for crisp transaction alerts */
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        /* Company Header */
        .brand-header {
            border-bottom: 1px solid #0f172a; /* Slate 900 */
            padding: 24px;
            text-align: center;
        }

        .brand-name {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.05em;
        }

        /* Content Area */
        .content {
            padding: 40px 32px;
            text-align: center; /* Centered content works perfectly for OTPs */
        }

        h2 {
            color: #0f172a;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        p {
            font-size: 15px;
            color: #475569;
            margin-bottom: 24px;
        }

        /* Premium OTP Container Box */
        .otp-container {
            padding: 24px;
            margin: 24px 0;
        }

        .otp-display {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 6px; /* Spaces out digits elegantly */
            color: #2563eb; /* Vibrant UI brand color */
            margin: 0;
            padding-left: 6px; /* Offsets letter-spacing tracking on the last digit */
        }

        .expiry-text {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
        }

        /* Standard Divider Rules */
        hr {
            border: 0;
            height: 1px;
            background-color: #e2e8f0;
            margin: 32px 0;
        }

        /* Security Disclaimer & Footer */
        .security-note {
            color: #dc2626 !important; /* Crimson Red for critical warning */
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .timestamp {
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="brand-header">
        <span class="brand-name">Shopyhub</span>
    </div>

    <div class="content">
        <h2>OTP Verification</h2>

        <p>Your OTP for <strong th:text="${otpType}">Account</strong> registration is:</p>

        <div class="otp-container">
            <h1 class="otp-display" th:text="${otp}">123456</h1>
        </div>

        <p class="expiry-text">This OTP is valid for <strong>5 minutes</strong>. Please do not close your window.</p>

        <hr/>

        <h4 class="security-note">⚠️ Security Note: Don't share this OTP with anyone.</h4>

        <p class="timestamp">
            Sent automatically by Shopyhub &bull; <span
                th:text="${#dates.format(#dates.createNow(), 'dd MMM yyyy, hh:mm a')}">27 May 2026, 09:11 PM</span>
        </p>
    </div>
</div>

</body>
</html>
