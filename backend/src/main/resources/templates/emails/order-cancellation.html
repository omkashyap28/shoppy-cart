<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Order Completed - Shopyhub</title>
    <style>
        /* Base Reset */
        body, p, h2 {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding: 40px 20px;
        }

        .wrapper {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        /* Company Header */
        .brand-header {
            background-color: #0f172a; /* Slate 900 */
            padding: 24px;
            text-align: center;
        }

        .brand-name {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.05em;
        }

        /* Content Area */
        .content {
            padding: 40px 32px;
        }

        /* Success Badge / Icon alignment */
        .success-title-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        h2 {
            color: #0f172a;
            font-size: 22px;
            font-weight: 700;
        }

        p {
            font-size: 16px;
            color: #475569;
            margin-bottom: 16px;
        }

        /* Order Information Banner */
        .order-banner {
            background-color: #f1f5f9;
            border-radius: 8px;
            padding: 16px;
            margin: 24px 0;
            border-left: 4px solid #10b981; /* Success green accent */
            font-size: 15px;
            color: #1e293b;
        }

        .order-id-value {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-weight: 600;
            color: #0f172a;
        }

        /* Track Order Action Button */
        .track-button {
            display: inline-block;
            background-color: #2563eb; /* Shopyhub Brand Blue */
            color: #ffffff !important;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 15px;
            margin: 12px 0 24px 0;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
            transition: background-color 0.2s ease;
        }

        /* Standard Divider Rules */
        hr {
            border: 0;
            height: 1px;
            background-color: #e2e8f0;
            margin: 32px 0;
        }

        /* Footer Details */
        .footer {
            text-align: center;
        }

        .footer-message {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
        }

        .timestamp {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Brand Header -->
    <div class="brand-header">
        <span class="brand-name">Shopyhub</span>
    </div>

    <!-- Main Content -->
    <div class="content">
        <div class="success-title-container">
            <h2>Order Cancellation</h2>
        </div>

        <p>Your order was canceled successfully. Thank you for shopping with us!</p>

        <!-- Order Metadata Context Box -->
        <div class="order-banner">
            Order Reference: <span class="order-id-value" th:text="${orderId}">#SH-98472-X</span>
        </div>

        <p>You can order same product again anytime.</p>


        <hr/>

        <!-- Footer / Timeline details -->
        <div class="footer">
            <p class="footer-message">Need help with your shipment? Reach out to support anytime.</p>
            <p class="timestamp">
                Sent automatically by Shopyhub &bull; <span
                    th:text="${#dates.format(#dates.createNow(), 'dd MMM yyyy, hh:mm a')}">27 May 2026, 09:18 PM</span>
            </p>
        </div>
    </div>
</div>

</body>
</html>
